<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Portrait Backdrop matching BK.jpeg -->
  <rect width="400" height="400" fill="#38BDF8" />
  <circle cx="200" cy="180" r="140" fill="#60A5FA" opacity="0.4" />
  
  <!-- Suit Blazer (Dark Navy) -->
  <path d="M 60 400 L 90 280 L 140 260 L 200 330 L 260 260 L 310 280 L 340 400 Z" fill="#0F172A" />
  <!-- Lapels -->
  <polygon points="140,260 170,330 190,300 155,255" fill="#1E293B" />
  <polygon points="260,260 230,330 210,300 245,255" fill="#1E293B" />
  
  <!-- Light Blue Dress Shirt -->
  <polygon points="170,250 200,290 230,250 215,245 200,250 185,245" fill="#93C5FD" stroke="#60A5FA" stroke-width="1" />
  <polygon points="175,245 190,265 180,242" fill="#DBEAFE" />
  <polygon points="225,245 210,265 220,242" fill="#DBEAFE" />
  
  <!-- Striped Tie -->
  <polygon points="194,275 206,275 210,380 200,395 190,380" fill="#1E1B4B" />
  <line x1="194" y1="290" x2="206" y2="295" stroke="#F43F5E" stroke-width="2.5" />
  <line x1="193" y1="310" x2="207" y2="315" stroke="#E2E8F0" stroke-width="2" />
  <line x1="192" y1="330" x2="208" y2="335" stroke="#F43F5E" stroke-width="2.5" />
  <line x1="191" y1="350" x2="209" y2="355" stroke="#E2E8F0" stroke-width="2" />
  <line x1="190" y1="370" x2="210" y2="375" stroke="#F43F5E" stroke-width="2.5" />
  
  <!-- Neck -->
  <rect x="180" y="210" width="40" height="45" fill="#E29D72" rx="4" />
  <path d="M 180 230 C 190 240 210 240 220 230 Z" fill="#C27A50" opacity="0.3" />
  
  <!-- Face & Head -->
  <ellipse cx="200" cy="165" rx="58" ry="72" fill="#E29D72" />
  
  <!-- Clean Trim Hair -->
  <path d="M 142 165 C 140 120 160 95 200 95 C 240 95 260 120 258 165 C 255 145 240 115 200 115 C 160 115 145 145 142 165 Z" fill="#0F172A" />
  <!-- Sideburns -->
  <rect x="141" y="150" width="6" height="25" fill="#0F172A" rx="2" />
  <rect x="253" y="150" width="6" height="25" fill="#0F172A" rx="2" />
  
  <!-- Eyes -->
  <ellipse cx="178" cy="158" rx="8" ry="5" fill="#FFFFFF" />
  <circle cx="178" cy="158" r="4.5" fill="#292524" />
  <ellipse cx="222" cy="158" rx="8" ry="5" fill="#FFFFFF" />
  <circle cx="222" cy="158" r="4.5" fill="#292524" />
  <!-- Eyebrows -->
  <path d="M 166 148 C 174 144 186 145 190 149" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <path d="M 234 148 C 226 144 214 145 210 149" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  
  <!-- Nose -->
  <path d="M 200 152 L 198 180 L 206 182" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
  
  <!-- Warm Dignified Smile -->
  <path d="M 184 198 C 192 206 208 206 216 198" stroke="#9A3412" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
